      (function() {
        // 1. Suppress any uncaught error setting read-only window.fetch in iframe
        var _handler = function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || String(e || '');
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', _handler, true);
        window.onerror = function(msg) {
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1) {
            return true;
          }
        };

        // 2. Allow assigning window.fetch or Window.prototype.fetch safely
        try {
          var orig = window.fetch;
          var custom = orig;
          Object.defineProperty(window, 'fetch', {
            get: function() { return custom; },
            set: function(v) { custom = v; },
            configurable: true,
            enumerable: true
          });
        } catch(err) {
          try {
            var proto = Object.getPrototypeOf(window) || Window.prototype;
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc && desc.get && !desc.set) {

                get: desc.get,
                set: function() {},
                configurable: true,
                enumerable: true
              });
            }
          } catch(err2) {}
        }
      })();

      (function() {

          const targets = [window, Window.prototype, Object.getPrototypeOf(window)];

              Object.defineProperty(target, 'fetch', {
